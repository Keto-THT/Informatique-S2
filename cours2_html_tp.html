<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV Grid Layout Dynamique</title>
    <style>
        /* --- Variables de couleurs --- */
        :root {
            --bg-small: #ffb3ba;   /* Rouge pâle pour petites boîtes */
            --bg-medium: #e6effc;  /* Bleu pâle (défaut) */
            --bg-large: #baffc9;   /* Vert pâle pour grandes boîtes */
            --border-color: #333;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            padding: 2rem;
            background-color: #fff;
        }

        /* --- Architecture de la Grille --- */
        .cv-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr); 
            grid-auto-rows: minmax(150px, auto); /* J'ai augmenté un peu la hauteur min */
            gap: 20px;
        }

        /* --- Définition des Blocs (The Components) --- */
        .box {
            /* 1. Définir l'élément comme un conteneur observable */
            container-type: inline-size;
            container-name: box-container;
            
            /* Couleur de fond par défaut (taille moyenne) */
            background-color: var(--bg-medium);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            font-weight: bold;
            
            /* --- MAGIE N°1 : TYPOGRAPHIE FLUIDE --- */
            /* clamp(MINIMUM, IDEAL, MAXIMUM)
               Le texte fera au minimum 1.2rem.
               Idéalement, il fera 5% de la largeur de son conteneur (5cqi).
               Il ne dépassera jamais 3rem.
            */
            font-size: clamp(1.2rem, 5cqi, 3rem);
            
            /* Pour centrer le texte et voir mieux l'effet */
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            transition: background-color 0.3s ease, font-size 0.1s ease;
        }

        /* --- MAGIE N°2 : CONTAINER QUERIES POUR LA COULEUR --- */
        
        /* CAS 1 : Si la boîte est PLUS PETITE que 350px */
        @container box-container (max-width: 350px) {
            .box {
                background-color: var(--bg-small);
                color: #d6cfc7; /* On fonce un peu le texte pour le contraste */
            }
            /* On ajoute un petit indicateur visuel */
            .box::after {
                content: "\A(Small)"; /* \A est un saut de ligne en CSS */
                font-size: 0.6em;
                display: block;
                background-color: #d6cfc7;
            }
        }

        /* CAS 2 : Si la boîte est PLUS GRANDE que 700px */
        @container box-container (min-width: 400px) {
            .box {
                background-color: #d6cfc7;
                color: #d4b483;
            }
            .box::after {
                content: "\A(Large)";
                font-size: 0.6em;
                display: block;
            }
        }

        /* --- Positionnement Spatiale (inchangé) --- */
        .header { grid-column: 1 / 9; grid-row: 1; }
        .education { grid-column: 9 / -1; grid-row: 1 / 3; }
        .experience { grid-column: 2 / 9; grid-row: 2; }
        .skills { grid-column: 3 / 11; grid-row: 3; }
        .languages { grid-column: 11 / -1; grid-row: 3; }

    </style>
</head>
<body>
    <main class="cv-grid">
        <header class="box header">Header</header>
        <aside class="box education">Education</aside>
        <section class="box experience">Experience</section>
        <section class="box skills">Skills</section>
        <div class="box languages">Languages</div>
    </main>
</body>
</html>
